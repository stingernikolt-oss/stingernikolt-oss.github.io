<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KODUS — редирект</title>
<script>
  // Сохраняем запрошенный путь и редиректим на корень,
  // где React Router сам откроет нужную страницу.
  var path = window.location.pathname + window.location.search + window.location.hash;
  sessionStorage.setItem('kodus.redirect', path);
  window.location.replace('/');
</script>
</head>
<body>
  <p>Перенаправление на KODUS…</p>
</body>
</html>
